<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 920px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1a1a1a;
  }
  .poster {
    width: 1080px;
    height: 1080px;
    background: #f5e9d3;
    padding: 72px 64px 64px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* noise-ish paper texture via subtle gradient */
  .poster::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(210,180,130,0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(210,180,130,0.15) 0%, transparent 40%);
    pointer-events: none;
  }
  .tape {
    position: absolute;
    width: 220px; height: 46px;
    background: rgba(255,255,255,0.45);
    border: 1px solid rgba(0,0,0,0.06);
    top: -14px;
  }
  .tape.tl { left: 120px; transform: rotate(-6deg); }
  .tape.tr { right: 120px; transform: rotate(5deg); }

  .kicker {
    display: inline-block;
    background: #1a1a1a;
    color: #f5e9d3;
    font-size: 34px;
    font-weight: 700;
    padding: 10px 26px;
    border-radius: 10px;
    letter-spacing: 4px;
    align-self: flex-start;
    transform: rotate(-2deg);
  }
  h1 {
    margin-top: 40px;
    font-size: 84px;
    line-height: 1.28;
    color: #1a1a1a;
    font-weight: 900;
    letter-spacing: 2px;
  }
  h1 .hl {
    background: linear-gradient(transparent 62%, #ffb02e 62%, #ffb02e 92%, transparent 92%);
    padding: 0 6px;
  }
  h1 .hl2 {
    background: linear-gradient(transparent 62%, #ff7a59 62%, #ff7a59 92%, transparent 92%);
    padding: 0 6px;
  }
  .emoji-face {
    position: absolute;
    right: 64px;
    top: 1010px;
    width: 200px;
    text-align: center;
    transform: rotate(8deg);
  }
  .face {
    width: 170px; height: 170px;
    border-radius: 50%;
    background: #ffd93b;
    border: 6px solid #1a1a1a;
    position: relative;
    box-shadow: 8px 8px 0 #1a1a1a;
  }
  .eye {
    position: absolute;
    top: 58px;
    width: 18px; height: 34px;
    background: #1a1a1a;
    border-radius: 50%;
  }
  .eye.l { left: 46px; }
  .eye.r { right: 46px; }
  .brow {
    position: absolute;
    top: 34px;
    width: 44px; height: 12px;
    background: #1a1a1a;
    border-radius: 8px;
  }
  .brow.l { left: 34px; transform: rotate(-14deg); }
  .brow.r { right: 34px; transform: rotate(14deg); }
  .mouth {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    width: 88px; height: 40px;
    border: 6px solid #1a1a1a;
    border-top: none;
    border-radius: 0 0 60px 60px;
    background: #fff;
  }
  .mouth::after {
    content: "";
    position: absolute;
    right: -2px; bottom: -2px;
    width: 16px; height: 16px;
    background: #1a1a1a;
    border-radius: 0 0 14px 0;
  }
  .scenes {
    margin-top: 52px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .scene {
    display: flex;
    align-items: flex-start;
    gap: 22px;
  }
  .scene .num {
    flex-shrink: 0;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: #1a1a1a;
    color: #ffd93b;
    font-size: 30px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 6px;
  }
  .scene .txt {
    font-size: 42px;
    line-height: 1.5;
    color: #1a1a1a;
    font-weight: 700;
  }
  .scene .txt small {
    display: block;
    font-size: 30px;
    font-weight: 500;
    color: #5a4a35;
    margin-top: 6px;
  }
  .footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    background: #1a1a1a;
    border-radius: 18px;
    padding: 30px 38px;
    color: #f5e9d3;
  }
  .footer .gh {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 1px;
  }
  .footer .sub {
    font-size: 26px;
    color: #c9bda5;
    margin-top: 6px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="tape tl"></div>
    <div class="tape tr"></div>

    <div class="kicker">打工人神器</div>

    <h1>
      下班挂 <span class="hl">AI 通宵跑任务</span><br>
      老板以为我<span class="hl2">关机了</span>
    </h1>

    <div class="scenes">
      <div class="scene">
        <div class="num">1</div>
        <div class="txt">
          一键假息屏：屏幕全黑像关机
          <small>系统其实醒着，任务照跑不误</small>
        </div>
      </div>
      <div class="scene">
        <div class="num">2</div>
        <div class="txt">
          人走了，电脑还在偷偷干活
          <small>下载、编译、挂机一个不停</small>
        </div>
      </div>
      <div class="scene">
        <div class="num">3</div>
        <div class="txt">
          10KB 小工具，免安装零广告
          <small>拷到哪用到哪，后台默默无闻</small>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
